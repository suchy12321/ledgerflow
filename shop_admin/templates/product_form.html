{% extends "base.html" %}
{% block title %}Produkt — Shop Admin{% endblock %}
{% block body %}
<div class="max-w-xl"><h1 class="text-3xl font-bold mb-5">{{ 'Edytuj produkt' if product else 'Nowy produkt' }}</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="card" method="post" action="{% if product %}/shop/products/{{ product.id }}/edit{% else %}/shop/products/new{% endif %}"><div class="field"><label>SKU</label><input name="sku" value="{{ product.sku if product else '' }}" required /></div><div class="field"><label>Nazwa</label><input name="name" value="{{ product.name if product else '' }}" required /></div><div class="grid grid-2"><div class="field"><label>Cena netto</label><input type="number" step="0.01" name="unit_price" value="{{ product.unit_price if product else '0.00' }}" required /></div><div class="field"><label>VAT %</label><input type="number" step="0.01" name="vat_rate" value="{{ product.vat_rate if product else '23' }}" required /></div></div><div class="field"><label>Opis</label><textarea name="description" rows="4">{{ product.description if product and product.description else '' }}</textarea></div><button class="btn btn-primary" type="submit">Zapisz</button> <a class="btn btn-secondary" href="/shop/products">Anuluj</a></form></div>
{% endblock %}
