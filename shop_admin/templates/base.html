<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Shop Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
    <style>
      :root { --ink:#172033; --muted:#64748b; --line:#e2e8f0; --paper:#f8fafc; --card:#fff; --brand:#4f46e5; --brand2:#0ea5e9; --ok:#059669; --warn:#d97706; --bad:#dc2626; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); background:var(--paper); }
      a { color:inherit; text-decoration:none; }
      .shell { min-height:100vh; display:flex; flex-direction:column; }
      .topbar { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
      .topbar-inner { max-width:1280px; margin:0 auto; padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
      .brand { font-size:1.35rem; font-weight:800; letter-spacing:-.03em; background:linear-gradient(135deg,var(--brand),var(--brand2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
      nav { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; }
      .navlink { padding:.55rem .8rem; border-radius:.65rem; font-size:.9rem; font-weight:600; color:#475569; }
      .navlink:hover, .navlink.active { background:#eef2ff; color:var(--brand); }
      main { max-width:1280px; width:100%; margin:0 auto; padding:1.5rem; flex:1; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:1rem; padding:1.25rem; box-shadow:0 2px 8px rgba(15,23,42,.04); margin-bottom:1rem; }
      .card:hover { box-shadow:0 5px 16px rgba(15,23,42,.07); }
      .grid { display:grid; gap:1rem; }
      .grid-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .grid-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
      @media(max-width:900px){ .grid-4,.grid-2{grid-template-columns:1fr 1fr;} }
      @media(max-width:600px){ main{padding:1rem;} .grid-4,.grid-2{grid-template-columns:1fr;} .topbar-inner{align-items:flex-start;} }
      .stat-label { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
      .stat-value { font-size:2rem; font-weight:800; letter-spacing:-.04em; margin-top:.2rem; }
      .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border-radius:.65rem; padding:.6rem .9rem; font-weight:700; font-size:.88rem; border:1px solid transparent; cursor:pointer; }
      .btn-primary { background:var(--brand); color:#fff; }
      .btn-primary:hover { background:#4338ca; }
      .btn-secondary { background:#eef2ff; color:var(--brand); border-color:#c7d2fe; }
      .btn-danger { background:#fef2f2; color:var(--bad); border-color:#fecaca; }
      .btn-sm { padding:.4rem .65rem; font-size:.8rem; }
      .pill { display:inline-flex; align-items:center; border-radius:999px; padding:.25rem .6rem; font-size:.75rem; font-weight:700; }
      .pill-ok { background:#ecfdf5; color:var(--ok); }
      .pill-warn { background:#fffbeb; color:var(--warn); }
      .pill-bad { background:#fef2f2; color:var(--bad); }
      .pill-neutral { background:#f1f5f9; color:var(--muted); }
      table { width:100%; border-collapse:collapse; }
      th { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; text-align:left; padding:.65rem .75rem; border-bottom:1px solid var(--line); }
      td { padding:.75rem; border-bottom:1px solid var(--line); vertical-align:top; font-size:.9rem; }
      tr:last-child td { border-bottom:0; }
      input,select,textarea { width:100%; border:1px solid #cbd5e1; border-radius:.65rem; padding:.65rem .75rem; font:inherit; background:#fff; }
      input:focus,select:focus,textarea:focus { outline:3px solid #c7d2fe; border-color:var(--brand); }
      label { display:block; font-size:.82rem; font-weight:700; margin-bottom:.35rem; color:#334155; }
      .field { margin-bottom:.9rem; }
      .flash { border-radius:.75rem; padding:.8rem 1rem; margin-bottom:1rem; font-size:.9rem; font-weight:600; }
      .flash.success { background:#ecfdf5; color:var(--ok); border:1px solid #a7f3d0; }
      .flash.error { background:#fef2f2; color:var(--bad); border:1px solid #fecaca; }
      .flash.info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
      .muted { color:var(--muted); } .small { font-size:.8rem; } .bold { font-weight:700; }
      .empty { border:1px dashed #cbd5e1; border-radius:1rem; padding:2rem; text-align:center; color:var(--muted); }
      .divider { height:1px; background:var(--line); margin:1rem 0; }
      .code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82rem; }
    </style>
  </head>
  <body class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/shop/dashboard">SHOP ADMIN</a>
        <nav aria-label="Główna nawigacja">
          <a class="navlink {% if request.url.path == '/shop/dashboard' %}active{% endif %}" href="/shop/dashboard">Dashboard</a>
          <a class="navlink {% if request.url.path.startswith('/shop/inbox') %}active{% endif %}" href="/shop/inbox">Skrzynka</a>
          <a class="navlink {% if request.url.path.startswith('/shop/orders') %}active{% endif %}" href="/shop/orders">Zamówienia</a>
          <a class="navlink {% if request.url.path.startswith('/shop/products') %}active{% endif %}" href="/shop/products">Produkty</a>
          <a class="navlink {% if request.url.path.startswith('/shop/warehouses') %}active{% endif %}" href="/shop/warehouses">Magazyny</a>
          <a class="navlink {% if request.url.path.startswith('/shop/customers') %}active{% endif %}" href="/shop/customers">Klienci</a>
          <form action="/shop/logout" method="post" class="ml-2"><button class="btn btn-secondary btn-sm" type="submit">Wyloguj</button></form>
        </nav>
      </div>
    </header>
    <main>
      {% if request.session.get('flash') %}
        {% for item in request.session.flash %}<div class="flash {{ item.category }}">{{ item.message }}</div>{% endfor %}
        {% set _ = request.session.pop('flash', None) %}
      {% endif %}
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
