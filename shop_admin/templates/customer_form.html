{% extends "base.html" %}
{% block title %}Klient — Shop Admin{% endblock %}
{% block body %}
<div class="max-w-xl"><h1 class="text-3xl font-bold mb-5">{{ 'Edytuj klienta' if customer else 'Nowy klient' }}</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form class="card" method="post" action="{% if customer %}/shop/customers/{{ customer.id }}/edit{% else %}/shop/customers/new{% endif %}"><div class="field"><label>Nazwa</label><input name="name" value="{{ customer.name if customer else '' }}" required /></div><div class="field"><label>E-mail</label><input type="email" name="email" value="{{ customer.email if customer and customer.email else '' }}" /></div><div class="grid grid-2"><div class="field"><label>Telefon</label><input name="phone" value="{{ customer.phone if customer and customer.phone else '' }}" /></div><div class="field"><label>NIP</label><input name="tax_id" value="{{ customer.tax_id if customer and customer.tax_id else '' }}" /></div></div><div class="field"><label>Messenger PSID</label><input name="messenger_psid" value="{{ customer.messenger_psid if customer and customer.messenger_psid else '' }}" /></div><div class="field"><label>Notatki</label><textarea name="notes" rows="4">{{ customer.notes if customer and customer.notes else '' }}</textarea></div><button class="btn btn-primary" type="submit">Zapisz</button> <a class="btn btn-secondary" href="/shop/customers">Anuluj</a></form></div>
{% endblock %}
