{% extends "base.html" %} {% block title %}Nowy klient · LedgerFlow{% endblock
	%} {% block body %}
	<div class="max-w-xl">
	  <div class="flex justify-between items-center mb-8">
	    <div class="flex flex-col">
	      <a href="/dashboard" class="btn btn-outline mb-4 flex items-center gap-3 hover:bg-accent/5 transition-colors">
	        <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
	          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
	        </svg>
	        <span>← Powrót do dashboardu</span>
	      </a>
	      <h1 class="text-3xl font-bold text-center bg-gradient-to-r from-accent to-indigo-600 bg-clip-text text-transparent mb-2">
	        Nowy klient
	      </h1>
	      <p class="text-lg text-muted max-w-xl">
	        Wypełnij dane — im więcej, tym lepiej działają automatyczne
	        przypisywanie dokumentów.
	      </p>
	    </div>
	  </div>

	  <form class="card" method="post" action="/clients/new">
	    <div class="space-y-6">
	      <div class="grid gap-4 sm:grid-cols-2">
	        <div>
	          <label class="text-sm font-semibold mb-2 block" for="name">Nazwa firmy *</label>
	          <input
	            type="text"
	            id="name"
	            name="name"
	            required
	            placeholder="np. ABC Transport Sp. z o.o."
	            autocomplete="organization"
	            class="w-full px-4 py-3 border border-muted/20 rounded-xl focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
	          />
	        </div>
	        <div>
	          <label class="text-sm font-semibold mb-2 block" for="email">Email (do matchowania maili)</label>
	          <input
	            type="email"
	            id="email"
	            name="email"
	            placeholder="biuro@firma.pl"
	            autocomplete="email"
	            class="w-full px-4 py-3 border border-muted/20 rounded-xl focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
	          />
	        </div>
	      </div>

	      <div class="grid gap-4 sm:grid-cols-2">
	        <div>
	          <label class="text-sm font-semibold mb-2 block" for="tax_id">NIP (10 cyfr, kluczowe do auto-przypisania)</label>
	          <input
	            type="text"
	            id="tax_id"
	            name="tax_id"
	            pattern="\d{10}"
	            maxlength="10"
	            placeholder="1234567890"
	            autocomplete="off"
	            class="w-full px-4 py-3 border border-muted/20 rounded-xl focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
	          />
	        </div>
	        <div>
	          <label class="text-sm font-semibold mb-2 block" for="kind">Typ działalności</label>
	          <select
	            id="kind"
	            name="kind"
	            class="w-full px-4 py-3 border border-muted/20 rounded-xl focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
	          >
	            <option value="company">
	              Spółka (wymaga: faktury, wyciąg bankowy)
	            </option>
	            <option value="sole_prop">
	              JDG (wymaga: faktury, wyciąg bankowy, paragony)
	            </option>
	          </select>
	        </div>
	      </div>

	      <div>
	        <label class="text-sm font-semibold mb-2 block" for="notes">Notatki (opcjonalnie)</label>
	        <textarea
	          id="notes"
	          name="notes"
	          rows="4"
	          placeholder="np. kontakt: Jan Kowalski, tel. 123-456-789"
	          class="w-full px-4 py-3 border border-muted/20 rounded-xl focus:border-accent focus:ring-2 focus:ring-accent/20 transition-all"
	        ></textarea>
	      </div>
	    </div>

	    <div class="flex justify-center pt-6">
	      <button class="btn btn-primary px-8 py-3" type="submit">
	        Zapisz klienta
	      </button>
	      <a href="/dashboard" class="btn btn-outline mx-4 px-8 py-3">Anuluj</a>
	    </div>
	  </form>
	</div>
	{% endblock %}
